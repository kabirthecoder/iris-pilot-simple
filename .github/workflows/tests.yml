name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: pilot
          POSTGRES_PASSWORD: pilot        # throwaway CI database, not a secret
          POSTGRES_DB: pilot
        ports:
          - 54320:5432
        options: >-
          --health-cmd "pg_isready -U pilot -d pilot"
          --health-interval 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: make install
      - name: The one command
        run: make run
      - name: Tests
        run: make test
      - name: Status must be OK after a good run
        run: make status
