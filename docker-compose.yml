services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: pilot
      POSTGRES_PASSWORD: pilot        # local only, not a secret
      POSTGRES_DB: pilot
    ports:
      - "54320:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilot -d pilot"]
      interval: 2s
      retries: 30
